function sym(x,y,dx,dy,t){const px=-dy,py=dx,P=(d,l)=>[x+dx*d+px*l,y+dy*d+py*l];
 const ln=(a,b)=>`<line class="ln" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;
 const bar=d=>ln(P(d,-9),P(d,9)),circ=d=>{const c=P(d,0);return `<circle cx="${c[0]}" cy="${c[1]}" r="5.5" fill="var(--card)" stroke="var(--text)" stroke-width="2"/>`};
 const crow=()=>ln(P(18,0),P(0,-10))+ln(P(18,0),P(0,10));
 return t=='1'?bar(12)+bar(20):t=='01'?bar(12)+circ(28):t=='M'?crow()+bar(24):crow()+circ(30)}
function link(a,b,ea,eb,lab){const A=E[a],B=E[b],ov=(p,q,r,s)=>(Math.max(p,r)+Math.min(q,s))/2;let pa,pb,da,db,h;
 if(A.x+W<=B.x||B.x+W<=A.x){const yy=ov(A.y,A.y+A.h,B.y,B.y+B.h),r=A.x<B.x;pa=[r?A.x+W:A.x,yy];pb=[r?B.x:B.x+W,yy];da=[r?1:-1,0];db=[-da[0],0];h=1}
 else{const xx=ov(A.x,A.x+W,B.x,B.x+W),d=A.y<B.y;pa=[xx,d?A.y+A.h:A.y];pb=[xx,d?B.y:B.y+B.h];da=[0,d?1:-1];db=[0,-da[1]];h=0}
 const T=e=>({'1':'1','01':'0..1','M':'1..M','0M':'0..M'})[e];
 let o=`<line class="ln" x1="${pa[0]}" y1="${pa[1]}" x2="${pb[0]}" y2="${pb[1]}"/>`+sym(pa[0],pa[1],da[0],da[1],ea)+sym(pb[0],pb[1],db[0],db[1],eb);
 const tx=(p,d,t)=>h?`<text x="${p[0]+d[0]*(t.length>1?23:16)}" y="${p[1]-14}" text-anchor="middle" font-size="${t.length>1?13:16}" font-weight="700" fill="#e11d48" style="fill:#e11d48">${t}</text>`:`<text x="${p[0]+16}" y="${p[1]+d[1]*18+5}" font-size="${t.length>1?13:16}" font-weight="700" style="fill:#e11d48">${t}</text>`;
 o+=tx(pa,da,T(ea))+tx(pb,db,T(eb));
 const mx=(pa[0]+pb[0])/2,my=(pa[1]+pb[1])/2;
 const Ls=lab.split('|'),n=Ls.length;
 o+=Ls.map((l,i)=>h?`<text class="mut" x="${mx}" y="${my+22+i*16}" text-anchor="middle" font-size="14" font-style="italic">${l}</text>`:`<text class="mut" x="${mx-12}" y="${my+5+(i-(n-1)/2)*16}" text-anchor="end" font-size="14" font-style="italic">${l}</text>`).join('');
 return o}
function ent(o){const c=PN[o.p-1][2],x=o.x,y=o.y;let s='';
 if(o.g){s=`<rect x="${x}" y="${y}" width="${W}" height="${o.h}" rx="9" fill="var(--card)" stroke="${c}" stroke-width="2" stroke-dasharray="7 5"/><rect x="${x}" y="${y}" width="${W}" height="${HH}" rx="9" fill="${c}" fill-opacity=".22"/><text x="${x+W/2}" y="${y+29}" text-anchor="middle" font-size="19" font-weight="700">${o.n}</text>`;
  o.a.forEach((a,i)=>{s+=badge(x+10,y+HH+5+i*RH,'PK')+`<text x="${x+48}" y="${y+HH+23+i*RH}" font-size="17" font-weight="700">${a.slice(1)}</text>`});
  s+=`<text class="mut" x="${x+W/2}" y="${y+o.h-9}" text-anchor="middle" font-size="13" font-style="italic">reference · see ${o.sec}</text>`;return s}
 s=`<rect x="${x}" y="${y}" width="${W}" height="${o.h}" rx="9" fill="var(--card)" stroke="${c}" stroke-width="2.5"/><path d="M${x} ${y+HH}V${y+9}a9 9 0 0 1 9-9H${x+W-9}a9 9 0 0 1 9 9V${y+HH}Z" fill="${c}"/><text x="${x+W/2}" y="${y+29}" text-anchor="middle" font-size="${o.n.length>22?14:o.n.length>20?15:19}" font-weight="700" style="fill:#fff">${o.n}</text>`;
 o.a.forEach((a,i)=>{const t=a[0],ry=y+HH+i*RH,nm=/[#@$]/.test(t)?a.slice(1):a;
  if(i)s+=`<line x1="${x+1}" y1="${ry+4}" x2="${x+W-1}" y2="${ry+4}" stroke="var(--line)" stroke-opacity=".35"/>`;
  if(t=='#')s+=badge(x+10,ry+8,'PK');if(t=='@')s+=badge(x+10,ry+8,'FK');if(t=='$')s+=badge(x+10,ry+8,'PFK');
